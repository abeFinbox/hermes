# Reverse proxy that fronts both Hermes backends behind one origin, so the UI
# backend toggle works in a containerized deploy exactly as it does in dev:
#   /_go/*  -> Go backend  (prefix stripped)
#   /*      -> Node backend (serves the frontend + its own /api and /mock)
# Same origin for both means the shared session cookie is always sent.
events {}

http {
  server {
    listen 8080;
    client_max_body_size 25m; # matches the 25MB file upload cap

    location /_go/ {
      proxy_pass http://go:4001/; # trailing slash strips the /_go prefix
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Hera (load testing) needs no rule of its own: /api/hera/* is carried by
    # the catch-all below, and /_go/ above strips the prefix for the Go lane.
    # Launching returns 202 immediately rather than holding the connection for
    # the length of the run, so nginx's default 60s proxy_read_timeout is never
    # in play — do not "fix" that by raising the timeout.
    location / {
      proxy_pass http://node:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
