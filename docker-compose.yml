# Hermes 2.0 — dual-backend deployment.
# Node and Go serve the SAME REST contract; the UI toggle picks which one
# handles requests. They share one SQLite volume and one JWT_SECRET, so the
# session/data is identical on both and switching is seamless.
#
#   docker compose up --build   ->   open http://localhost:8080
services:
  node:
    build: .
    image: hermes:latest
    environment:
      # MUST be identical across both backends so tokens validate on either.
      JWT_SECRET: "change-me-to-a-long-random-string"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "change-me"
      DATA_DIR: "/data"
    volumes:
      - hermes-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  go:
    build:
      context: .
      dockerfile: Dockerfile.go
    image: hermes-go:latest
    environment:
      JWT_SECRET: "change-me-to-a-long-random-string" # same value as node
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "change-me"
      DATA_DIR: "/data"
    volumes:
      - hermes-data:/data # same volume as node → shared app.db + jwt-secret
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node
      - go
    restart: unless-stopped

volumes:
  hermes-data:
