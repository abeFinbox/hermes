# Hermes 2.0 — dual-backend deployment.
# Node and Go serve the SAME REST contract; the UI toggle picks which one
# handles requests. They share one SQLite volume and one JWT_SECRET, so the
# session/data is identical on both and switching is seamless.
#
#   docker compose up --build   ->   open http://localhost:8080
services:
  node:
    build: .
    image: hermes:latest
    environment:
      # MUST be identical across both backends so tokens validate on either.
      JWT_SECRET: "change-me-to-a-long-random-string"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "change-me"
      DATA_DIR: "/data"
      # Hera (k6 load testing). Both backends must agree: they share the
      # database, and therefore the single-run lock.
      HERA_ENABLED: "1"
      HERA_TARGET_ALLOW: "*.finbox.in"        # empty = this instance's own /mock ONLY
      # HERA_MAX_VUS: "20"           # ceiling 100
      # HERA_MAX_DURATION_SEC: "60"  # ceiling 300
      # HERA_ALLOW_MODERATOR: "0"    # 1 lets moderators launch, not just admins
      # Live log panel + per-step failure diagnostics.
      # HERA_LOG_LINES: "2000"       # lines kept in memory per run (100-20000)
      # HERA_DIAG: "1"               # one line per failed step: status + k6 error code
      # HERA_DIAG_MAX: "3"           # PER VU, so the real ceiling is this x vus
      # HERA_DIAG_BODY: "1"          # 0 stops storing response snippets AT REST
      # HERA_DIAG_BODY_MAX: "512"    # truncation for that snippet (ceiling 2048)
    volumes:
      - hermes-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  go:
    build:
      context: .
      dockerfile: Dockerfile.go
    image: hermes-go:latest
    environment:
      JWT_SECRET: "change-me-to-a-long-random-string" # same value as node
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "change-me"
      DATA_DIR: "/data"
      HERA_ENABLED: "1" # keep in step with the node service above
      HERA_TARGET_ALLOW: "*.finbox.in"        # empty = this instance's own /mock ONLY
      # Uncomment in step with the node service — HERA_DIAG_BODY especially, or
      # one engine stores response bodies and the other does not.
      # HERA_LOG_LINES: "2000"
      # HERA_DIAG: "1"
      # HERA_DIAG_MAX: "3"
      # HERA_DIAG_BODY: "1"
      # HERA_DIAG_BODY_MAX: "512"
    volumes:
      - hermes-data:/data # same volume as node → shared app.db + jwt-secret
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node
      - go
    restart: unless-stopped

volumes:
  hermes-data:
