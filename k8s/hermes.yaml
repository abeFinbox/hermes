# Hermes on Kubernetes — single-image deployment.
#
# NOTE ON SCALING: this manifest uses replicas: 1 with a ReadWriteOnce PVC
# because the default storage is SQLite (a single file). To run multiple
# replicas, migrate the backend to Postgres (see HOW-TO-DEPLOY.md) and switch
# this to a stateless Deployment (no PVC) pointing at the shared DB — then
# raise replicas and add the HPA at the bottom.
#
#   kubectl apply -f k8s/hermes.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
type: Opaque
stringData:
  # CHANGE THESE — or create the Secret out-of-band and delete this block
  JWT_SECRET: "change-me-to-a-long-random-string"
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "change-me"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels: { app: hermes }
spec:
  replicas: 1                 # keep at 1 while on SQLite (see note above)
  strategy:
    type: Recreate           # avoid two pods opening the same SQLite file
  selector:
    matchLabels: { app: hermes }
  template:
    metadata:
      labels: { app: hermes }
    spec:
      containers:
        - name: hermes
          image: hermes:latest        # push to your registry and set the ref
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: DATA_DIR
              value: /data
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: hermes-secrets, key: JWT_SECRET } }
            - name: ADMIN_USER
              valueFrom: { secretKeyRef: { name: hermes-secrets, key: ADMIN_USER } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: hermes-secrets, key: ADMIN_PASSWORD } }
            # Hera (k6 load testing) — OFF here on purpose. The limits below are
            # 500m CPU, and CFS throttling stalls k6's own userspace timing loop,
            # so the latencies it reported would be measuring that throttling
            # rather than your target. Hera additionally refuses to start below
            # 1000m unless HERA_ALLOW_CONSTRAINED=1. See the enablement block at
            # the bottom of this file before turning it on.
            - name: HERA_ENABLED
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # timeoutSeconds and failureThreshold are set EXPLICITLY here, and they
          # matter whether or not Hera is enabled: the defaults are 1s and 3, so
          # three slow probes 20s apart kill the pod after 60s of ANY CPU
          # contention — and with strategy: Recreate on a ReadWriteOnce PVC that
          # means a full teardown and recreate, potentially mid-run.
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # Deliberately NOT raised for Hera: bumping every existing
            # deployment to a bigger request can make the pod unschedulable on a
            # small cluster, which is a worse failure than Hera being off.
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi", ephemeral-storage: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        # k6 resolves its config directory from HOME, which distroless does not
        # set; Hera points the child process at /tmp.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector: { app: hermes }
  ports:
    - port: 80
      targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"   # large Postman imports
spec:
  rules:
    - host: hermes.example.com      # <-- your host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes
                port: { number: 80 }
